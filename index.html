<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>井字棋AI</title>
<style>
.b{display:grid;grid-template-columns:repeat(3,80px);gap:4px;margin:10px 0;}
.c{width:80px;height:80px;font-size:32px;cursor:pointer;}
</style>
</head>
<body>
<div>
难度：
<select id="level">
<option value="easy">简单</option>
<option value="mid">中等</option>
<option value="hard">困难</option>
</select>
<button onclick="undo()">悔棋</button>
<button onclick="restart()">重置</button>
</div>
<div class="b" id="b"></div>
<p id="s"></p>
<p>玩家胜：<span id="win">0</span> &nbsp;AI胜：<span id="lose">0</span> &nbsp;平局：<span id="draw">0</span></p>
<script>
let board=Array(9).fill(null),h='X',ai='O';
let history=[];
let winCnt=0,loseCnt=0,drawCnt=0;
const b=document.getElementById('b'),s=document.getElementById('s');

function render(){
b.innerHTML='';
board.forEach((v,i)=>{
let d=document.createElement('button');
d.className='c';d.textContent=v;
d.onclick=()=>playerMove(i);
b.appendChild(d);
})
checkResult();
}

function playerMove(i){
if(board[i])return;
history.push([...board]);
board[i]=h;render();
if(checkResult())return;
setTimeout(aiMove,300);
}

function aiMove(){
const lv=document.getElementById('level').value;
let best=-1,val=-Infinity;
const empty=[];
for(let i=0;i<9;i++) if(!board[i]) empty.push(i);

//简单模式随机落子
if(lv==="easy"){
best = empty[Math.floor(Math.random()*empty.length)];
}else if(lv==="mid"){
//中等模式50%最优，50%随机
if(Math.random()>0.5){
best = empty[Math.floor(Math.random()*empty.length)];
}else{
for(let i of empty){
board[i]=ai;
let score=minimax(board,false);
board[i]=null;
if(score>val){val=score;best=i;}
}
}
}else{
//困难极小极大最优算法
for(let i of empty){
board[i]=ai;
let score=minimax(board,false);
board[i]=null;
if(score>val){val=score;best=i;}
}
}
board[best]=ai;render();
}

//极小极大核心
function minimax(b,isMax){
let res=getWinner(b);
if(res===ai)return 1;
if(res===h)return -1;
if(!b.includes(null))return 0;
if(isMax){
let maxS=-Infinity;
for(let i=0;i<9;i++){
if(!b[i]){
b[i]=ai;
let sc=minimax(b,false);
b[i]=null;
maxS=Math.max(maxS,sc);
}
}
return maxS;
}else{
let minS=Infinity;
for(let i=0;i<9;i++){
if(!b[i]){
b[i]=h;
let sc=minimax(b,true);
b[i]=null;
minS=Math.min(minS,sc);
}
}
return minS;
}
}

function getWinner(b){
const win=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
for(let w of win){
if(b[w[0]]&&b[w[0]]===b[w[1]]&&b[w[0]]===b[w[2]])return b[w[0]];
}
return null;
}

function checkResult(){
let w=getWinner(board);
if(w){
if(w==='X'){
s.textContent="玩家获胜";winCnt++;document.getElementById("win").innerText=winCnt;
}else{
s.textContent="AI获胜";loseCnt++;document.getElementById("lose").innerText=loseCnt;
}
return true;
}
if(!board.includes(null)){
s.textContent="平局";drawCnt++;document.getElementById("draw").innerText=drawCnt;
return true;
}
s.textContent="轮到你落子(X)";
return false;
}

//悔棋
function undo(){
if(history.length===0) return;
board = history.pop();
render();
}

function restart(){
board=Array(9).fill(null);
history=[];
render();
}
render();
</script>
</body>
</html>
