<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>井字棋AI</title>
<style>
.b{display:grid;grid-template-columns:repeat(3,80px);gap:4px}
.c{width:80px;height:80px;font-size:32px}
</style>
</head>
<body>
<div class="b" id="b"></div>
<p id="s"></p>
<button onclick="restart()">重置</button>
<script>
let board=Array(9).fill(null),h='X',ai='O';
const b=document.getElementById('b'),s=document.getElementById('s');

function render(){
b.innerHTML='';
board.forEach((v,i)=>{
let d=document.createElement('button');
d.className='c';d.textContent=v;d.onclick=()=>move(i);
b.appendChild(d);
})
}

function move(i){
if(board[i]||win(board,h)||win(board,ai))return;
board[i]=h;render();
if(win(board,h)){s.innerText="你赢";return}
if(board.every(x=>x)){s.innerText="平局";return}
setTimeout(aiGo,200);
}

function aiGo(){
let best=minimax(board,ai).idx;
board[best]=ai;render();
if(win(board,ai))s.innerText="AI赢";
else if(board.every(x=>x))s.innerText="平局";
else s.innerText="轮到你";
}

function win(b,p){
const w=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
return w.some(x=>x.every(i=>b[i]===p))
}

function minimax(brd,player){
let empty=brd.map((v,i)=>v?null:i).filter(x=>x!==null);
if(win(brd,h))return{sc:-10};
if(win(brd,ai))return{sc:10};
if(!empty.length)return{sc:0};
let arr=[];
for(let i of empty){
brd[i]=player;
let res=minimax(brd,player===ai?h:ai);
arr.push({idx:i,sc:res.sc});
brd[i]=null;
}
if(player===ai)return arr.reduce((a,b)=>a.sc>b.sc?a:b);
else return arr.reduce((a,b)=>a.sc<b.sc?a:b);
}

function restart(){
board=Array(9).fill(null);s.innerText="你来落子X";render();
}
restart();
</script>
</body>
</html>
